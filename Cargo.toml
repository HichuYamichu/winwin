[package]
name = "winwin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
windows = { version = "0.60.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_Graphics_Dwm" ] }
tracing = { version = "0.1", features = ["attributes"]  }
tracing-subscriber = "0.3"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }

